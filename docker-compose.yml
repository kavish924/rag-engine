version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000

    ports:
      - "8000:8000"

    depends_on:
      chromadb:
        condition: service_healthy

    volumes:
      - ./scripts/sample_corpus:/app/scripts/sample_corpus:ro
      - bm25_data:/app/chroma_data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000

    command: python -m scripts.seed_corpus

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - ./scripts/sample_corpus:/app/scripts/sample_corpus:ro
      - bm25_data:/app/chroma_data

    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      streamlit run frontend/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0

    env_file:
      - .env

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  chroma_data:
  bm25_data: